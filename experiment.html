<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study</title>

    <script type="importmap">
        {
            "imports": {
                "@utils/": "./core/utils/",
                "@jspsych/": "./core/jspsych/",
                "@tasks/": "./tasks/",
                "@api/": "./api/",
                "@images/": "./assets/images/"
            }
        }
    </script>
    
    <!-- jsPsych Core Files -->
    <script src="core/jspsych/jspsych.js"></script>
    <script src="core/jspsych/plugin-html-keyboard-response.js"></script>
    <script src="core/jspsych/plugin-html-button-response.js"></script>
    <script src="core/jspsych/plugin-instructions.js"></script>
    <script src="core/jspsych/plugin-preload.js"></script>
    <script src="core/jspsych/plugin-call-function.js"></script>
    <script src="core/jspsych/plugin-fullscreen.js"></script>
    <script src="core/jspsych/plugin-survey-multi-choice.js"></script>
    <script src="core/jspsych/plugin-survey-likert.js"></script>

    
    <!-- Task-specific files -->
    <script src="tasks/card-choosing/plugin-card-choosing.js"></script>
    <script src="tasks/control/plugins/plugin-explore-ship.js"></script>
    <script src="tasks/control/plugins/plugin-explore-ship-feedback.js"></script>
    <script src="tasks/control/plugins/plugin-predict-home-base.js"></script>
    <script src="tasks/control/plugins/plugin-reward-ship.js"></script>
    <script src="tasks/control/plugins/plugin-reward-prompt.js"></script>
    <script src="tasks/reversal/plugin-reversal.js"></script>
    <script src="tasks/open-text/plugin-open-text.js"></script>

    
    <!-- Core utilities -->
    <script type="module" src="core/utils/index.js"></script>

    <!-- CSS Styles -->
    <link href="core/jspsych/jspsych.css" rel="stylesheet" type="text/css" />

    <style>
        html, body {
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        #display_element {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .instructions p {
            max-width: min(700px, 92vw);
            text-align: left;
            margin: 1em 0;
        }

        .instructions td {
            padding-left: 20px;
            padding-right: 20px
        }

        /* Orientation gate: on phones, block the wrong orientation for the active task; tablets/
           desktop are exempt (larger min dimension). Driven by
           <body data-preferred-orientation="portrait|landscape">, set per task by the registry. */
        #rotate-overlay {
            display: none;
            flex-direction: column;
            gap: 20px;
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 100000;
            background: #ffffff;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        #rotate-overlay p {
            font-size: clamp(18px, 5vw, 24px);
            color: #182b4b;
            line-height: 1.4;
            max-width: 90vw;
            margin: 0;
            display: none;
        }
        .phone-rotate-icon {
            width: 80px;
            height: 80px;
            display: none;
        }
        .phone-rotate-icon svg {
            width: 100%;
            height: 100%;
            transform-origin: center center;
        }
        /* default (no angle override): phone top pointing right → icon animates CCW back to portrait */
        @keyframes rotate-portrait-from-right {
            0%, 15%  { transform: rotate(90deg); }
            55%, 85% { transform: rotate(0deg); }
            100%     { transform: rotate(90deg); }
        }
        /* [data-orientation-angle="90"]: phone top pointing left → icon animates CW back to portrait */
        @keyframes rotate-portrait-from-left {
            0%, 15%  { transform: rotate(-90deg); }
            55%, 85% { transform: rotate(0deg); }
            100%     { transform: rotate(-90deg); }
        }
        @keyframes rotate-to-landscape {
            0%, 15%  { transform: rotate(0deg); }
            55%, 85% { transform: rotate(90deg); }
            100%     { transform: rotate(0deg); }
        }
        /* Portrait-preferred task on a phone held in landscape */
        @media (orientation: landscape) and (max-height: 500px) {
            body[data-preferred-orientation="portrait"] #rotate-overlay { display: flex; }
            body[data-preferred-orientation="portrait"] #rotate-overlay .rotate-msg-portrait { display: block; }
            body[data-preferred-orientation="portrait"] .phone-rotate-icon { display: block; }
            /* Default: device tilted CW / top pointing right (angle=270) → guide CCW back */
            body[data-preferred-orientation="portrait"] .phone-rotate-icon svg { animation: rotate-portrait-from-right 2.5s ease-in-out infinite; }
            /* Override: device tilted CCW / top pointing left (angle=90) → guide CW back */
            body[data-preferred-orientation="portrait"][data-orientation-angle="90"] .phone-rotate-icon svg { animation: rotate-portrait-from-left 2.5s ease-in-out infinite; }
        }
        /* Landscape-preferred task on a phone held in portrait */
        @media (orientation: portrait) and (max-width: 500px) {
            body[data-preferred-orientation="landscape"] #rotate-overlay { display: flex; }
            body[data-preferred-orientation="landscape"] #rotate-overlay .rotate-msg-landscape { display: block; }
            body[data-preferred-orientation="landscape"] .phone-rotate-icon { display: block; }
            body[data-preferred-orientation="landscape"] .phone-rotate-icon svg { animation: rotate-to-landscape 2.5s ease-in-out infinite; }
        }
    </style>
</head>
<body>
    <div id='display_element' class='jsPsychDE'></div>

    <div id="rotate-overlay">
        <div class="phone-rotate-icon">
            <svg viewBox="0 0 60 100" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="2" width="56" height="96" rx="10" fill="#182b4b"/>
                <rect x="6" y="14" width="48" height="72" rx="5" fill="#e2e8f2"/>
                <circle cx="30" cy="7" r="3" fill="#4a6fa5"/>
                <rect x="20" y="90" width="20" height="4" rx="2" fill="#4a6fa5"/>
            </svg>
        </div>
        <p class="rotate-msg-portrait">Please rotate your device to <strong>portrait</strong> mode to continue.</p>
        <p class="rotate-msg-landscape">Please rotate your device to <strong>landscape</strong> mode to continue.</p>
    </div>
    
    <script>
        (function () {
            function setOrientationAngle() {
                var angle = (screen.orientation?.angle != null ? screen.orientation.angle : (window.orientation || 0));
                // Normalise to 0–359 (window.orientation can return -90)
                document.body.setAttribute('data-orientation-angle', String(((angle % 360) + 360) % 360));
            }
            setOrientationAngle();
            window.addEventListener('orientationchange', setOrientationAngle);
            window.addEventListener('resize', setOrientationAngle);
        })();
    </script>

    <script type="module">
        // Import task registry functions
        import { createTaskTimeline, getTask, getTaskInfo } from '@api/index.js';
        import { bonusTrial, enterExperiment, getResumptionState, saveDataREDCap,
                 signalLoadSuccess } from '@utils/index.js';

        // Initialize jsPsych. The pause/resume hook is installed by enterExperiment, which
        // owns both the message listener and the buffer it drains.
        window.jsPsych = initJsPsych({
            display_element: 'display_element',
            // Last-ditch save if the participant closes or reloads mid-task - without this
            // everything since the last periodic save is lost.
            on_close: () => { saveDataREDCap(); },
            on_finish: function(data) {
                // Display results
                jsPsych.getDisplayElement().innerHTML = '<p>Thank you for participating! You may now close this tab.</p>';
            }
        });

        // Read the query string once - every launch parameter comes from the same place, and
        // a single accessor is what keeps a rename on the website side from being missed
        // (as `module_state` was).
        const urlParams = new URLSearchParams(window.location.search);

        // Get parameters from URL (populated by index.html's setup form redirect)
        window.context = urlParams.get('context') || 'relmed';
        window.participantID = urlParams.get('participant_id') || '';
        window.simulating = window.participantID.includes("simulate") || false;
        window.debug = window.participantID.includes("debug") || window.participantID.includes("TST");
        // Resolves the website's `module_state`, falling back to the older `state` name
        window.last_state = getResumptionState();
        window.session_state = JSON.parse(urlParams.get('session_state') || "{}");

        // Stamped into every trial for provenance; kept in this exact shape because
        // .releaserc.json rewrites the literal on release.
        jsPsych.data.addProperties({
            version: "1.5.4"
        });

        // Which task to run. Vigour and reversal don't vary by session, but
        // session is still a required field, and will be provided by the
        // website.
        window.session = urlParams.get('session') || '';
        const taskName = urlParams.get('task') || '';
        window.module = taskName;

        // Order in which the study runs its reversal sequences, so the website's default
        // "Session N" labels can select one. Week-style labels and raw sequence keys are
        // matched against the registry directly and don't depend on this.
        const sessionOrder = ['wk0', 'wk2', 'wk4', 'wk24', 'wk28'];

        /**
         * Resolves a session label to a reversal sequence key from TaskRegistry.
         *
         * The label is whatever the study admin named the session in StudyManagement, so
         * accept mymeds' default ("Session 1"), RELMED-style week labels ("Week 0"), and the
         * raw keys ("wk0", "screening"). Availability comes from the registry rather than a
         * hand-maintained list here, so adding a sequence there is enough.
         *
         * @param {string} label - The session label from the URL
         * @returns {string|null} A key of TaskRegistry.reversal.sequences, or null
         */
        function resolveReversalSequence(label) {
            const sequences = getTask('reversal').sequences || {};
            const normalized = label.trim().toLowerCase().replace(/[\s_-]+/g, '');

            // Raw sequence key, e.g. "wk0" or "screening"
            if (sequences[normalized]) return normalized;

            // mymeds maps its "Training" session onto the screening sequence
            if (normalized === 'training' && sequences.screening) return 'screening';

            // Week label, e.g. "Week 24" -> "wk24"
            const week = normalized.match(/^week(\d+)$/);
            if (week && sequences[`wk${week[1]}`]) return `wk${week[1]}`;

            // Ordinal label, e.g. "Session 2" -> the 2nd sequence the study runs
            const session = normalized.match(/^session(\d+)$/);
            if (session) {
                const key = sessionOrder[parseInt(session[1], 10) - 1];
                if (key && sequences[key]) return key;
            }

            return null;
        }

        /**
         * Describes the session labels resolveReversalSequence accepts, derived from the same
         * registry it resolves against so the error message can't drift from the behaviour.
         *
         * @returns {string} Human-readable list of accepted labels
         */
        function describeAcceptedSessions() {
            const keys = Object.keys(getTask('reversal').sequences || {});
            const weekLabels = keys.filter((key) => /^wk\d+$/.test(key))
                                   .map((key) => `"Week ${key.slice(2)}"`);
            const sessionCount = sessionOrder.filter((key) => keys.includes(key)).length;

            return [
                sessionCount ? `"Session 1"-"Session ${sessionCount}"` : null,
                weekLabels.length ? weekLabels.join(', ') : null,
                keys.includes('screening') ? '"Training"' : null,
                `or a sequence key (${keys.join(', ')})`
            ].filter(Boolean).join(', ');
        }

        const bonusRules = {
            reversal: {
                max_bonus: 1.00,
                min_prop_bonus: 0.00
            },
            vigour: {
                max_bonus: 1.00,
                min_prop_bonus: 0.00
            }
        };

        // Function to run the experiment
        async function runExperiment() {
            try {
                // Fail fast if this page was reached without what index.html's setup form
                // provides - otherwise createTaskTimeline throws deep in the call stack for a
                // missing task, and an unrecognized context fails silently later (saveDataREDCap
                // only saves data for "relmed"/"prolific" contexts).
                if (!taskName) {
                    throw new Error('Missing "task" URL parameter. Launch this page via index.html rather than directly.');
                }
                if (window.context !== 'relmed' && window.context !== 'prolific') {
                    throw new Error(`Missing or unrecognized "context" URL parameter ("${window.context}"). Expected "relmed" (also used for mymeds) or "prolific".`);
                }
                // REDCap rejects a submission with no session (post-data requires it), so this
                // is fatal for every task even though only reversal maps it to a sequence.
                if (!window.session) {
                    throw new Error('Missing "session" URL parameter. Launch this page via index.html rather than directly.');
                }

                const sequence = resolveReversalSequence(window.session);
                if (taskName === "reversal" && !sequence) {
                    throw new Error(`Unrecognized "session" URL parameter ("${window.session}") - the reversal task needs it to pick a trial sequence. Accepted: ${describeAcceptedSessions()}.`);
                }

                // Get task information
                const taskInfo = getTaskInfo(taskName);
                console.log('Task info:', taskInfo);

                // Reversal selects a week-specific sequence; vigour uses session as metadata only.
                const taskConfig =
                    taskName === "reversal"
                        ? { sequence }
                        : {};

                const timeline = await createTaskTimeline(taskName, taskConfig);
                console.log('Timeline created:', timeline);

                // Report success only once all fallible task setup has completed. If timeline
                // construction fails, the website's load timeout remains active and provides
                // the participant with its normal recovery dialog.
                signalLoadSuccess();

                const standaloneModule = {
                    elements: [
                        {
                            type: "task",
                            name: taskName,
                            __task: getTask(taskName)
                        }
                    ],
                    ...bonusRules[taskName]
                };

                // Create the complete timeline
                const fullTimeline = [
                    enterExperiment,
                    ...timeline,
                    bonusTrial(standaloneModule)
                ];

                // Run the experiment
                if (window.simulating) {
                    console.log('Simulating experiment run...');

                    // Simulation options
                    let simulation_options = {
                            default: {
                                data: {
                                    rt: 200,
                                    speed_up: true,
                                    speed_up_factor: 10,
                                }
                            }
                    }

                    await jsPsych.simulate(fullTimeline, "visual", simulation_options);
                } else {
                    console.log('Running experiment...');
                    await jsPsych.run(fullTimeline);
                }

            } catch (error) {
                console.error('Error running experiment:', error);
                // jsPsych.getDisplayElement() is only populated once jsPsych.run()/simulate()
                // has started (inside prepareDom()) - errors thrown before that point (e.g. the
                // guard above, or createTaskTimeline for an unknown task) need the raw container.
                const errorContainer = jsPsych.getDisplayElement() || document.getElementById('display_element');
                errorContainer.innerHTML = `
                    <div style="text-align: center; padding: 50px;">
                        <h2>Error Loading Experiment</h2>
                        <p>There was an error loading the ${taskName || 'requested'} task:</p>
                        <p><strong>${error.message}</strong></p>
                        <p>Please check the console for more details.</p>
                    </div>
                `;
            }
        }

        // Start the experiment when the page loads
        window.addEventListener('load', runExperiment);
    </script>
</body>
</html>
