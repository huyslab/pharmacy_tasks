<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <base href="../">
    <title>Session Feedback</title>

    <script type="importmap">
        {
            "imports": {
                "@utils/": "./core/utils/",
                "@jspsych/": "./core/jspsych/",
                "@tasks/": "./tasks/",
                "@api/": "./api/",
                "@images/": "./assets/images/"
            }
        }
    </script>

    <!-- jsPsych Core Files -->
    <script src="./core/jspsych/jspsych.js"></script>
    <script src="./core/jspsych/plugin-html-keyboard-response.js"></script>
    <script src="./core/jspsych/plugin-html-button-response.js"></script>
    <script src="./core/jspsych/plugin-fullscreen.js"></script>
    <script src="./core/jspsych/plugin-instructions.js"></script>
    <script src="./core/jspsych/plugin-preload.js"></script>
    <script src="./core/jspsych/plugin-call-function.js"></script>

    <!-- Task-specific files: the questionnaire is built from stock survey plugins -->
    <script src="./core/jspsych/plugin-survey-likert.js"></script>
    <script src="./core/jspsych/plugin-survey-text.js"></script>

    <!-- Core utilities -->
    <script type="module" src="./core/utils/index.js"></script>

    <!-- CSS Styles -->
    <link href="./core/jspsych/jspsych.css" rel="stylesheet" type="text/css" />
    <link href="./core/styles/theme.css" rel="stylesheet" type="text/css" />

    <style>
        html, body {
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--rlm-font);
        }

        #display_element {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The intro screen carries css_classes: ['instructions'], which experiment.html
           styles for the real runs. Repeated here, as the other example pages do, so a
           preview shows the same measure rather than one line across a laptop screen. */
    </style>
</head>
<body>
    <div id="display_element"></div>

    <script type="module">
        // Import task registry functions
        import { createTaskTimeline, getTaskInfo } from './api/index.js';

        // Get parameters from URL
        window.participantID = new URLSearchParams(window.location.search).get('participant_id') || '';
        window.simulating = window.participantID.includes("simulate") || false;

        // Initialize jsPsych
        window.jsPsych = initJsPsych({
            display_element: 'display_element',
            on_finish: function(data) {
                jsPsych.getDisplayElement().innerHTML = '<p>Feedback complete. Thank you!</p>';
                console.log('Feedback data:', data.values());
            }
        });

        // Function to run the experiment
        async function runExperiment() {
            try {
                console.log('Starting session feedback...');

                // Get task information
                const taskInfo = getTaskInfo('session_feedback');
                console.log('Task info:', taskInfo);

                // Create the task timeline with default settings
                const timeline = await createTaskTimeline('session_feedback', {});
                console.log('Timeline created:', timeline);

                // No fullscreen entry here: the open questions use the device keyboard, which
                // mobile browsers handle better outside of fullscreen
                if (window.simulating) {
                    console.log('Simulating experiment run...');
                    await jsPsych.simulate(timeline, "visual");
                } else {
                    console.log('Running experiment...');
                    await jsPsych.run(timeline);
                }

            } catch (error) {
                console.error('Error running experiment:', error);
                jsPsych.getDisplayElement().innerHTML = `
                    <div style="text-align: center; padding: 50px;">
                        <h2>Error Loading Experiment</h2>
                        <p>There was an error loading the feedback questionnaire:</p>
                        <p><strong>${error.message}</strong></p>
                        <p>Please check the console for more details.</p>
                    </div>
                `;
            }
        }

        // Start the experiment when the page loads
        window.addEventListener('load', runExperiment);
    </script>
</body>
</html>
